#      psql -h db -U murad -d postgres -v ON_ERROR_STOP=1 -f /migrations/10_channel_reads.sql
#      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CONFIG_PATH: ./config/prod.yaml
      HTTP_SERVER_PASSWORD: ${HTTP_SERVER_PASSWORD}
      STORAGE_PATH: postgres://${POSTGRES_USER:-murad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-murad}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
#      migrate:
#        condition: service_completed_successfully
    # Порт наружу не публикуется — backend доступен только из docker-сети (через frontend/nginx).

  # PROXY_AUTH и HTTP_SERVER_PASSWORD должны отражать один и тот же пароль:
  #   PROXY_AUTH="Basic $(printf 'Murrr228:<пароль>' | base64)"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PROXY_AUTH: ${PROXY_AUTH}
    # Порт наружу не публикуется — публичный вход только через caddy (TLS-терминация).

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
